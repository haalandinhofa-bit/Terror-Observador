name: Build Northvale Launcher
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Clone PojavLauncher base
        run: |
          git clone --branch v3_openjdk --recurse-submodules https://github.com/PojavLauncherTeam/PojavLauncher.git source
      - name: Apply Northvale identity
        run: |
          cd source
          sed -i "s/net.kdt.pojavlaunch/com.erling.northvale/g" app_pojavlauncher/build.gradle
          find app_pojavlauncher/src/main/res -name '*.xml' -o -name '*.json' | xargs grep -l 'PojavLauncher' 2>/dev/null | xargs -r sed -i 's/PojavLauncher (Minecraft: Java Edition for Android)/Northvale Launcher/g; s/PojavLauncher/Northvale Launcher/g'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Get LTW
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          cd source/app_pojavlauncher/libs
          wget -O ltw-release.aar https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar
      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: source/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav
      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: source/app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-pojav
      - name: Get JRE21
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: source/app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-pojav
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build Java components
        run: |
          cd source
          ./scripts/languagelist_updater.sh
          gradle :jre_lwjgl3glfw:build --no-daemon
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          cd source
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mkdir -p ../out
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk ../out/NorthvaleLauncher-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NorthvaleLauncher-debug-apk
          path: out/NorthvaleLauncher-debug.apk
